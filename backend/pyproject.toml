[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ansikten-backend"
version = "1.8.0"
description = "Face recognition backend for event photography"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python",
    "rawpy",
    "prompt_toolkit",
    "rich",
    "pyxdg",
    "matplotlib",
    # InsightFace backend. Pinned exactly: embeddings are the load-bearing
    # artifact (encodings.pkl stores 512-dim vectors from a specific release),
    # so the version is gated on embedding stability, not floated. See
    # benchmarks/upgrade_compare.py for the re-runnable stability gate.
    "insightface==1.0.1",
    "onnxruntime==1.27.0",
    # FastAPI server
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Upper bound: the lint rule set is pinned in [tool.ruff.lint], but cap
    # the version too so a new minor cannot change autofix or parser
    # behaviour unannounced. Raise deliberately, not by drift.
    "ruff>=0.6,<0.17",
]
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools]
py-modules = []
packages = ["core"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "dist",
    "build",
    ".venv",
    "preprocessed_cache",
]

[tool.ruff.lint]
# Explicit rule set: ruff's classic default (E4/E7/E9 + F) plus import
# sorting (I) and the modern-typing family (UP006/UP035/UP045).
#
# Listed explicitly rather than as `extend-select = ["I"]` because the
# implicit default set is version-dependent. Ruff 0.16.0 widened it and
# broke CI with 947 findings in untouched code (the ruff step runs before
# pytest, so the backend tests stopped running too). Pinning the set here
# means a new ruff release can no longer silently change which rules apply;
# adopting new rules is a deliberate edit to this list.
#
# The remaining rules ruff 0.16 would add by default (LOG015, G201, BLE001,
# DTZ005, SIM102, RUF100, E402) are adopted family by family, not at once.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP006",  # List[x] -> list[x]
    "UP035",  # deprecated typing imports
    "UP045",  # Optional[x] -> x | None
]

[tool.ruff.lint.per-file-ignores]
# server.py imports its routers after the FastAPI app is constructed to
# avoid circular imports; E402 (import-not-at-top) is intentional here.
"api/server.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "benchmark: timing comparison, not a strict correctness gate (deselect with -m 'not benchmark')",
]
