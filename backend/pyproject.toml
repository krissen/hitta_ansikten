[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ansikten-backend"
version = "1.8.0"
description = "Face recognition backend for event photography"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python",
    "rawpy",
    "prompt_toolkit",
    "rich",
    "pyxdg",
    "matplotlib",
    # InsightFace backend. Pinned exactly: embeddings are the load-bearing
    # artifact (encodings.pkl stores 512-dim vectors from a specific release),
    # so the version is gated on embedding stability, not floated. See
    # benchmarks/upgrade_compare.py for the re-runnable stability gate.
    "insightface==1.0.1",
    "onnxruntime==1.27.0",
    # FastAPI server
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Pinned to the exact version the pre-commit hook runs (see
    # .pre-commit-config.yaml, astral-sh/ruff-pre-commit rev). The lint rule
    # set is pinned in [tool.ruff.lint], but the version matters too: a local
    # `ruff check`/`ruff format` must say the same thing as the grind, and an
    # unpinned range let 0.16.6 install here while the hook stayed on 0.16.5.
    # Raise deliberately, in step with the hook rev, not by drift.
    "ruff==0.16.5",
]
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools]
py-modules = []
packages = ["core"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "dist",
    "build",
    ".venv",
    "preprocessed_cache",
]

[tool.ruff.lint]
# Explicit rule set: ruff's classic default (E4/E7/E9 + F) plus import
# sorting (I) and the modern-typing family (UP006/UP035/UP045).
#
# Listed explicitly rather than as `extend-select = ["I"]` because the
# implicit default set is version-dependent. Ruff 0.16.0 widened it and
# broke CI with 947 findings in untouched code (the ruff step runs before
# pytest, so the backend tests stopped running too). Pinning the set here
# means a new ruff release can no longer silently change which rules apply;
# adopting new rules is a deliberate edit to this list.
#
# Every rule ruff 0.16 would add by default has now been adopted, family by
# family rather than all at once; `DTZ005` was the last of them, so nothing
# remains outstanding. `E402` is deliberately absent from that sequence: it is
# already part of `E4` above and measures zero findings here, so there is
# nothing to adopt — do not add it back.
select = [
    "BLE001",  # blind `except Exception`
    "DTZ005",  # naive datetime.now(); the noqa sites are naive on-disk formats
    "E4",
    "E7",
    "E9",
    "F",
    "G201",  # logger.error(..., exc_info=True) -> logger.exception(...)
    "I",
    "LOG015",  # root-logger call; use a module logger
    "RUF100",  # unused `# noqa` directive
    "SIM102",  # collapsible nested `if`
    "UP006",  # List[x] -> list[x]
    "UP035",  # deprecated typing imports
    "UP045",  # Optional[x] -> x | None
]

[tool.ruff.lint.per-file-ignores]
# server.py imports its routers after the FastAPI app is constructed to
# avoid circular imports; E402 (import-not-at-top) is intentional here.
"api/server.py" = ["E402"]

# Archived one-off scripts, kept for reference and not run in normal operation.
# Their `except Exception` blocks are "print a warning and continue to the next
# record" throughout; auditing them per site would document scripts nobody
# maintains rather than improve the shipped code.
"scripts/archive/*" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "benchmark: timing comparison, not a strict correctness gate (deselect with -m 'not benchmark')",
]
