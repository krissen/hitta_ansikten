# Continuous integration for Ansikten
# Runs the backend (pytest) and frontend (Vitest + workspace build) test
# suites on every pull request and on pushes to the long-lived branches.
#
# The release workflow (.github/workflows/release.yml) only runs on version
# tags, so this is the gate that protects dev/master from broken changes.

name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - master

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      # face_recognition builds dlib from source, which needs cmake and a
      # C/C++ toolchain (mirrors the linux job in release.yml).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libdlib-dev

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        working-directory: backend
        run: ruff check .

      - name: Run pytest
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Build workspace
        working-directory: frontend
        run: npm run build:workspace
